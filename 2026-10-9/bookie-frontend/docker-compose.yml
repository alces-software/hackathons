# Run just the frontend:  docker compose up --build -d  → http://<vm>:3001
#
# The core API is expected on the VM's port 3000 (e.g. from the compose in
# ../alces-bookie). SSR reaches it from inside the container via the docker
# bridge gateway — set API_URL in .env if your core lives elsewhere.
#
# If the VM's address isn't localhost (opening the site from another machine),
# set the websocket the browser should use before building, e.g. in .env:
#   NEXT_PUBLIC_WS_URL=ws://<vm-address>:3000/api/v1/ws

name: bookie-frontend

services:
  frontend:
    container_name: bookie_frontend
    restart: unless-stopped
    build:
      context: .
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3000/api/v1/ws}
    environment:
      API_URL: ${API_URL:-http://172.17.0.1:3000/api/v1}
    ports:
      - "3001:3000"