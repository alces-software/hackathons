# One service here — just this frontend.  docker compose up -d  → :3001
#
# The core is a separate service, run by its own compose in ../alces-bookie
# (which publishes the API on :3000). They stay out of each other's business:
# this file only needs to know where to reach it.
#
# The app runs the way the core itself runs: no image of its own, just the
# node container with this checkout bound in and a run.sh that installs,
# builds and serves. Source edits take effect on the next
#   docker compose restart frontend
#
# Server-side reads reach the core over the host's published port. If the
# core lives somewhere other than this VM's :3000, change the API_URL line.
#
# The websocket the BROWSER should use is baked into the client bundle at
# build time. If the site is opened from another machine, set it in .env:
#   NEXT_PUBLIC_WS_URL=ws://<vm-address>:3000/api/v1/ws

name: bookie-frontend

services:
  frontend:
    image: node:latest
    restart: unless-stopped
    working_dir: /app/src
    volumes:
      - ./:/app/src
    command: ./run.sh
    environment:
      # Server-side reads go out to the core on the VM
      API_URL: http://10.151.0.85:3000/api/v1
      # Baked into the client bundle while the container builds
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://10.151.0.85:3000/api/v1/ws}
      NEXT_TELEMETRY_DISABLED: 1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3000"