                type: object
                properties:
                  username:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  before:
                    type: number
                  after:
                    type: number
                  service:
                    type: object
                    properties:
                      id:
                        type: number
                      name:
                        type: string
                    required:
                      - id
                      - name
                required:
                  - username
                  - timestamp
                  - before
                  - after
                  - service
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
