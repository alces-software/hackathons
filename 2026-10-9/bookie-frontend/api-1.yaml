                        receiver:
                          type:
                          - string
                          - 'null'
                        createdAt:
                          type: string
                          format: date-time
                        amount:
                          type: number
                        service:
                          type: object
                          properties:
                            id:
                              type:
                              - integer
                              - 'null'
                            name:
                              type:
                              - string
                              - 'null'
                          required:
                          - id
                          - name
                      required:
                      - id
                      - sender
                      - receiver
                      - createdAt
                      - amount
                      - service
                    description: The paginated data from the API
                  currentPage:
                    type: number
                    description: The current page of the pagination
                  totalPages:
                    type: number
                    description: The total number of pages that are available
                  limit:
                    type: number
                    description: How many items will be returned by the get
                  itemCount:
                    type: number
                    description: How many items have been returned by this page
                  itemTotal:
                    type: number
                    description: How many there are to be displayed
                required:
                - data
                - currentPage
                - totalPages
                - limit
                - itemCount
                - itemTotal
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
