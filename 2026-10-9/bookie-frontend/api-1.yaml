                    type: string
                    enum:
                    - NOT_FOUND
                  message:
                    anyOf:
                    - type: string
                      enum:
                      - The requested resource does not exist
                    - type: string
                required:
                - error
                - message
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    enum:
                    - An unexpected error occurred
