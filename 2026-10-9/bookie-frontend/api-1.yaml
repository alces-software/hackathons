openapi: 3.1.0
info:
  title: Alces Bookie
  version: 1.0.0
servers:
- url: /api/v1
components:
  schemas: {}
  parameters: {}
paths:
  /bank/loan:
    post:
      description: Add a loan to a user
      tags:
      - Bank
      - Users
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 4
                  maxLength: 25
                password:
                  type: string
                  minLength: 4
                  maxLength: 30
                amount:
                  type: number
                  minimum: 1
              required:
              - username
              - password
              - amount
      responses:
        '204':
          description: Loan added successfully
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - BAD_REQUEST
                  message:
                    anyOf:
                    - type: string
                      enum:
                      - The request was malformed
                    - type: string
                required:
                - error
                - message
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - UNAUTHORISED
                  message:
                    anyOf:
                    - type: string
                      enum:
                      - The request credentials are incorrect
                    - type: string
                required:
                - error
                - message
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - NOT_FOUND
                  message:
                    anyOf:
                    - type: string
                      enum:
                      - The requested resource does not exist
                    - type: string
                required:
                - error
                - message
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    enum:
                    - An unexpected error occurred
                required:
                - error
                - message
  /bank/fees:
    get:
      description: Get the transaction fees
      tags:
      - Bank
      responses:
        '200':
          description: Retrieved the transaction fees successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  userTransactionFee:
                    type: number
                  serviceTransactionFee:
                    type: number
                required:
                - userTransactionFee
                - serviceTransactionFee
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    enum:
                    - An unexpected error occurred
                required:
                - error
                - message
  /bank/repay:
    post:
      description: Remove a loan from a user
      tags:
      - Bank
      - Users
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 4
                  maxLength: 25
                password:
                  type: string
                  minLength: 4
                  maxLength: 30
                amount:
                  type: number
                  minimum: 1
              required:
              - username
              - password
              - amount
      responses:
        '204':
          description: Loan removed successfully
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - BAD_REQUEST
                  message:
                    anyOf:
                    - type: string
                      enum:
                      - The request was malformed
                    - type: string
                required:
                - error
                - message
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - UNAUTHORISED
                  message:
                    anyOf:
                    - type: string
                      enum:
                      - The request credentials are incorrect
                    - type: string
                required:
                - error
                - message
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - NOT_FOUND
                  message:
                    anyOf:
                    - type: string
                      enum:
                      - The requested resource does not exist
                    - type: string
                required:
                - error
                - message
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    enum:
                    - An unexpected error occurred
                required:
                - error
                - message
  /services/transaction:
    post:
      description: Performs a transaction for service
      tags:
      - Services
      - Transactions
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 4
                  maxLength: 25
                password:
                  type: string
                  minLength: 4
                  maxLength: 30
                serviceToken:
                  type: string
                  minLength: 1
                amount:
                  type: number
                  minimum: 0
                type:
                  type: string
                  enum:
                  - win
                  - loss
                  - hold
                  - return
              required:
              - username
              - password
              - serviceToken
              - amount
              - type
      responses:
        '200':
          description: Successfully created a transaction
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                required:
                - id
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - BAD_REQUEST
                  message:
                    anyOf:
                    - type: string
                      enum:
                      - The request was malformed
                    - type: string
                required:
                - error
                - message
        '401':
          description: Unauthorised
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - UNAUTHORISED
                  message:
                    anyOf:
                    - type: string
                      enum:
                      - The request credentials are incorrect
                    - type: string
                required:
                - error
                - message
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - NOT_FOUND
                  message:
                    anyOf:
                    - type: string
                      enum:
                      - The requested resource does not exist
                    - type: string
                required:
                - error
                - message
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    enum:
                    - An unexpected error occurred
                required:
                - error
                - message
  /services/{name}:
    get:
      description: Get a service
      tags:
      - Services
      parameters:
      - schema:
          type: string
          minLength: 4
          maxLength: 25
        required: true
        name: name
        in: path
      responses:
        '200':
          description: Retrieved a service successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  balance:
                    type:
                    - number
                    - 'null'
                required:
                - id
                - name
                - balance
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - NOT_FOUND
                  message:
                    anyOf:
                    - type: string
                      enum:
                      - The requested resource does not exist
