                        service:
                          type: object
                          properties:
                            id:
                              type: number
                            name:
                              type: string
                          required:
                            - id
                            - name
                      required:
                        - username
                        - timestamp
                        - before
                        - after
                        - service
                    description: The paginated data from the API
                  currentPage:
                    type: number
                    description: The current page of the pagination
                  totalPages:
                    type: number
                    description: The total number of pages that are available
                  limit:
                    type: number
                    description: How many items will be returned by the get
                  itemCount:
                    type: number
                    description: How many items have been returned by this page
                  itemTotal:
                    type: number
                    description: How many there are to be displayed
                required:
                  - data
                  - currentPage
                  - totalPages
                  - limit
                  - itemCount
                  - itemTotal
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - NOT_FOUND
                  message:
                    anyOf:
                      - type: string
                        enum:
                          - The requested resource does not exist
                      - type: string
                required:
                  - error
                  - message
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - INTERNAL_SERVER_ERROR
                  message:
                    type: string
                    enum:
                      - An unexpected error occurred
                required:
                  - error
                  - message
