      responses:
        '200':
          description: Retired a transaction successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  sender:
                    type:
                    - string
                    - 'null'
                  receiver:
                    type:
                    - string
                    - 'null'
                  createdAt:
                    type: string
                    format: date-time
                  amount:
                    type: number
                  service:
                    type: object
                    properties:
                      id:
                        type:
                        - integer
                        - 'null'
                      name:
                        type:
                        - string
                        - 'null'
                    required:
                    - id
                    - name
                required:
                - id
                - sender
                - receiver
                - createdAt
                - amount
                - service
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
