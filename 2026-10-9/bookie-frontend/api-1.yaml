          maximum: 100
          default: 25
          description: How many items to retrieve
          example: '40'
        required: false
        description: How many items to retrieve
        name: limit
        in: query
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        required: false
        name: order
        in: query
      responses:
        '200':
          description: Retired all transactions successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        sender:
                          type:
