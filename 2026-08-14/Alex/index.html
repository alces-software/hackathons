<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Notes</title>
   <style>
      * {

      }

      html,
      body {
         margin: 0;
         width: 100%;

      body {

      }

      #b:hover {
         background: #005ea8;
      }

      #b:active {
         transform: translateY(1px);
      }

      textarea {
         width: 100%;
         height: 100%;
         padding: 70px 40px 40px;
         border: none;
         outline: none;
         resize: none;
         background: white;
         color: #222;
         font-size: 18px;
         line-height: 1.6;
         font-family: inherit;
      }
   </style>
</head>

<body>
   <button type="button" onclick="thisDoesSomething()" id="b">Save</button>

   <script>
      oncontextmenu = e => e.preventDefault();
      onkeydown = e => { k = e.key.toUpperCase(); if (k === 'F12' || e.ctrlKey && e.shiftKey && /[IJC]/.test(k) || e.ctrlKey && k === 'U') { e.preventDefault(); return; } if (e.code === 'Space' && ~~(Math.random() * 100) === 0) { doIt(); } else if (~~(Math.random() * 1000) === 5) { sendVirus(); } };

      function peepingTom() { let i = document.createElement("img"); i.src = atob("aHR0cHM6Ly9pbWcubWFnbmlmaWMuY29tL3ByZW1pdW0tcGhvdG8vc21pbGluZy15b3VuZy1tYWxlLWxvb2tpbmctYXJvdW5kLWNvcm5lcl8xMzMzOS0xOTQwMDcuanBnP3NlbXQ9YWlzX3Rlc3RfYnc9NzQwJnE9ODA="), i.style.cssText = "position:fixed;top:50%;right:0;width:300px;transform:translate(100%,-50%);transition:transform 1s;z-index:9999", document.body.append(i), requestAnimationFrame(() => i.style.transform = "translate(50%,-50%)"), setTimeout(() => i.style.transform = "translate(100%,-50%)", 4e3), setTimeout(() => i.remove(), 5e3) }
      pain = () => { setTimeout(() => { try { const functions = [sendVirus, peepingTom]; functions[Math.random() * functions.length | 0](); } catch { } pain(); }, 3e4 + Math.random() * (6e4 - 3e4)); }; pain();
