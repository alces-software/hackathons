services:
  casino:
    build:
      context: .
      dockerfile: Dockerfile
    image: alces-casino:latest
    container_name: alces-casino
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      BANKING_API_URL: ${BANKING_API_URL:-http://10.151.0.132:3000/api/v1}
      BANKING_SERVICE_TOKEN: ${BANKING_SERVICE_TOKEN:?Set BANKING_SERVICE_TOKEN in .env}
      CASINO_USERNAME: ${CASINO_USERNAME:-AlcesCasino}
      CASINO_PASSWORD: ${CASINO_PASSWORD:?Set CASINO_PASSWORD in .env}
    ports:
      - "3000:3000"
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
